<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stephany's Christmas Wish List</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <header>
      <!-- the pink bow -->
      <svg class="bow" viewBox="0 0 120 80" aria-hidden="true">
        <g fill="#f4b6cc" stroke="#7a5446" stroke-width="2" stroke-linejoin="round">
          <path d="M60 32 C30 0 5 10 10 35 C14 55 40 46 60 36 Z"/>
          <path d="M60 32 C90 0 115 10 110 35 C106 55 80 46 60 36 Z"/>
          <path d="M54 38 L36 77 L49 69 L58 78 L62 40 Z"/>
          <path d="M66 38 L84 77 L71 69 L62 78 L58 40 Z"/>
          <rect x="51" y="25" width="18" height="17" rx="6"/>
        </g>
      </svg>

      <div class="oval">
        <h1>
          <span class="merry">Merry</span>
          <span class="christmas">Christmas</span>
        </h1>
        <p class="intro">
          Here’s what I’m dreaming of this year! Tap <b>Mark as bought</b>
          once you’ve picked something out. Thank you ♡
        </p>
      </div>

      <p class="about">
        Some of these are for my mycelium bio-insulation research, some are
        for tinkering and school, and some are just for fun (and cute!) ♡
      </p>

      <p id="count"></p>
    </header>

    <main>
      <ul id="grid"></ul>
      <p id="message"></p>
    </main>

    <footer>Thank you for thinking of me ♡</footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
